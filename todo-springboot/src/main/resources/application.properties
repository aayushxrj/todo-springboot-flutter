spring.application.name=Todo-App
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/todo
spring.datasource.username=root
spring.datasource.password=todo
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=9191
server.error.include-message=always
server.error.include-binding-errors=always

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

permify.base-url=http://localhost:3476
permify.tenant-id=t1
permify.schema-path=classpath:permify/schema.perm

todoslist.base-url=http://localhost:8080

# Disable Spring Cloud discovery auto-configuration (avoid SimpleDiscoveryClient classload errors)
spring.cloud.discovery.enabled=false
spring.cloud.discovery.client.simple.enabled=false
spring.autoconfigure.exclude=org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
spring.cloud.compatibility-verifier.enabled=false