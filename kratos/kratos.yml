version: v1.0.0

dsn: postgres://kratos:kratos@kratos-postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://localhost:4433/
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: http://localhost:4455/
  allowed_return_urls:
    - http://localhost:4455
  methods:
    password:
      enabled: true
  flows:
    login:
      ui_url: http://localhost:4455/login
    registration:
      ui_url: http://localhost:4455/registration
    settings:
      ui_url: http://localhost:4455/settings
    recovery:
      enabled: false
    verification:
      enabled: false

session:
  lifespan: 24h

log:
  level: debug

secrets:
  cookie:
    - change-me-random-randomrandomran
  cipher:
    - change-me-random-randomrandomran

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/identity.schema.json
