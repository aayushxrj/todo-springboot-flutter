apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todos-list
  template:
    metadata:
      labels:
        app: todos-list
    spec:
      containers:
        - name: todos-list
          image: todos-list:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/todo
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: todo
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: todos-list
spec:
  type: ClusterIP
  selector:
    app: todos-list
  ports:
    - name: http
      port: 8080
      targetPort: 8080