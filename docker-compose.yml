services:
  todo-springboot:
    build:
      context: ./todo-springboot
    image: todo-springboot
    ports:
      - "9191:9191"
    depends_on:
      - mysql

  todo-flutter-web:
    build:
      context: ./todo_flutter
    image: todo-flutter-web
    ports:
      - "8081:80"
    depends_on:
      - todo-springboot

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: todo
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
