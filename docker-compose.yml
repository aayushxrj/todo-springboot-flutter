services:
  todo-backend:
    build:
      context: ./todo-springboot
    image: todo-springboot
    ports:
      - "9191:9191"
    depends_on:
      - mysql

  todo-flutter-web:
    build:
      context: ./todo_flutter
    image: todo-flutter-web
    ports:
      - "8081:80"
    depends_on:
      - todo-backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: todo
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - todo-backend
  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
volumes:
  mysql_data:

