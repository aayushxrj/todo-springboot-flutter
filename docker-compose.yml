services:
  todo-backend:
    build:
      context: ./todo-springboot
    image: todo-springboot
    ports:
      - "9191:9191"
    depends_on:
      - mysql
      - todos-list
      - permify
    environment:
      PERMIFY_BASE_URL: http://permify:3476
      PERMIFY_TENANT_ID: t1
      TODOSLIST_BASE_URL: http://todos-list:8080

  todos-list:
    build:
      context: ./todos-list
    image: todos-list
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/todo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: todo

  todo-flutter-web:
    build:
      context: ./todo_flutter
    image: todo-flutter-web
    ports:
      - "8081:80"
    depends_on:
      - todo-backend

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: todo
      MYSQL_DATABASE: todo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  kratos-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    ports:
      - "5432:5432"
    volumes:
      - kratos_postgres_data:/var/lib/postgresql/data

  kratos-migrate:
    image: oryd/kratos:v1.2.0
    command: ["migrate", "sql", "-e", "--yes"]
    environment:
      DSN: postgres://kratos:kratos@kratos-postgres:5432/kratos?sslmode=disable
    volumes:
      - ./kratos:/etc/config
    depends_on:
      - kratos-postgres

  kratos:
    image: oryd/kratos:v1.2.0
    command: ["serve", "-c", "/etc/config/kratos.yml"]
    environment:
      DSN: postgres://kratos:kratos@kratos-postgres:5432/kratos?sslmode=disable
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./kratos:/etc/config
    depends_on:
      - kratos-postgres

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - todo-backend
  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

  permify:
    image: ghcr.io/permify/permify
    ports:
      - "3476:3476"
      - "3478:3478"
volumes:
  mysql_data:
  kratos_postgres_data:

